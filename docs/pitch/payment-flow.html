<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment status · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.5rem; }
    .lead { font-family: 'Instrument Serif', serif; font-style: italic; color: #4f5d75; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Yoo Yaao · Checkout · /checkout/status</p>
    <h1>Every payment ends in a state you can see</h1>
    <p class="lead">One status page for Stripe returns and the no-charge demo. Nobody is left on a blank screen.</p>
    <div class="scroll">
    <svg viewBox="0 0 880 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="payment-flow-title payment-flow-desc">
      <title id="payment-flow-title">Payment status state machine</title>
      <desc id="payment-flow-desc">A selected plan moves to payment, which ends paid, cancelled, or failed or expired with a retry; when Stripe is off, a labelled demo runs to a demo receipt without charging or saving anything.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Transitions (drawn before nodes) -->
      <line x1="66" y1="200" x2="120" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="200" x2="360" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="200" x2="640" y2="200" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M400 240 V282 Q400 290 392 290 H248 Q240 290 240 298 V340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M440 240 V282 Q440 290 448 290 H552 Q560 290 560 298 V340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M600 340 V264 Q600 256 592 256 H544 Q536 256 536 248 V236 Q536 228 528 228 H520" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="200" y1="340" x2="200" y2="240" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M200 160 V80 Q200 72 208 72 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="520" y1="72" x2="640" y2="72" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Transition labels (opaque masks) -->
      <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em" text-anchor="middle">
        <rect x="296" y="178" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="188" fill="#4f5d75">PAY</text>
        <rect x="550" y="178" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="580" y="188" fill="#bf4520">CONFIRMED</text>
        <rect x="270" y="270" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="318" y="280" fill="#4f5d75">BACK ON STRIPE</text>
        <rect x="452" y="270" width="92" height="12" rx="2" fill="#f5f5f5"/><text x="498" y="280" fill="#4f5d75">EXPIRED · TIMEOUT</text>
        <rect x="608" y="292" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="644" y="302" fill="#4f5d75">CHECK AGAIN</text>
        <rect x="128" y="284" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="160" y="294" fill="#4f5d75">TRY AGAIN</text>
        <rect x="244" y="52" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="280" y="62" fill="#4f5d75">STRIPE OFF</text>
        <rect x="556" y="52" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="580" y="62" fill="#4f5d75">2.5 S</text>
      </g>

      <circle cx="60" cy="200" r="6" fill="#2d3142"/>

      <!-- Nodes -->
      <g font-family="'Geist', sans-serif" text-anchor="middle">
        <rect x="120" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="200" y="198" font-size="14" font-weight="600" fill="#2d3142">Selected plan</text>
        <text x="200" y="216" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">pricing · buddy · partner</text>

        <rect x="360" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="440" y="198" font-size="14" font-weight="600" fill="#2d3142">Processing</text>
        <text x="440" y="216" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">polls status every 2 s</text>

        <rect x="640" y="160" width="160" height="80" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="720" y="198" font-size="14" font-weight="600" fill="#2d3142">Paid</text>
        <text x="720" y="216" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">receipt · webhook saves</text>

        <rect x="160" y="340" width="160" height="80" rx="8" fill="#ffffff" stroke="#4f5d75"/>
        <text x="240" y="378" font-size="14" font-weight="600" fill="#2d3142">Cancelled</text>
        <text x="240" y="396" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">not charged</text>

        <rect x="480" y="340" width="160" height="80" rx="8" fill="#ffffff" stroke="#4f5d75"/>
        <text x="560" y="378" font-size="14" font-weight="600" fill="#2d3142">Failed / expired</text>
        <text x="560" y="396" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">not charged · retry</text>

        <rect x="360" y="40" width="160" height="64" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-dasharray="4,3"/>
        <text x="440" y="70" font-size="14" font-weight="600" fill="#2d3142">Demo run</text>
        <text x="440" y="88" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">no Stripe · no DB</text>

        <rect x="640" y="40" width="160" height="64" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-dasharray="4,3"/>
        <text x="720" y="70" font-size="14" font-weight="600" fill="#2d3142">Demo receipt</text>
        <text x="720" y="88" font-size="9" font-family="'Geist Mono', monospace" fill="#4f5d75">labelled DEMO-xxxx</text>
      </g>

      <!-- Legend strip -->
      <line x1="40" y1="452" x2="840" y2="452" stroke="rgba(45,49,66,0.15)"/>
      <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">
        <line x1="40" y1="476" x2="72" y2="476" stroke="#bf4520" stroke-width="1.4"/><text x="80" y="479">happy path</text>
        <line x1="180" y1="476" x2="212" y2="476" stroke="#4f5d75" stroke-width="1.2"/><text x="220" y="479">real Stripe event</text>
        <line x1="360" y1="476" x2="392" y2="476" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/><text x="400" y="479">user retry or demo (no charge)</text>
      </g>
    </svg>
    </div>
  </div>
</body>
</html>
